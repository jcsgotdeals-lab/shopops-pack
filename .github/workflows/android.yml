# Builds the Android app (APK) on every push to main and on manual runs.
# Download it from the run's "Artifacts" section, or from Releases when you push a tag like v1.0.0.
name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - name: Install Capacitor
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Download Firebase (team sync)
        run: |
          V=10.14.1; mkdir -p app/vendor/firebase
          for m in app firestore auth; do curl -fsSL "https://www.gstatic.com/firebasejs/$V/firebase-$m.js" -o "app/vendor/firebase/firebase-$m.js"; done
          sed -i "s#https://www.gstatic.com/firebasejs/$V/#./#g" app/vendor/firebase/*.js
          if grep -l "gstatic.com/firebasejs" app/vendor/firebase/*.js; then echo "Firebase files still point online"; exit 1; fi
      - name: Create Android project
        run: |
          npx cap add android
          bash android-extras/patch-android.sh
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../JC-Got-Trays.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JC-Got-Trays-apk
          path: JC-Got-Trays.apk
      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JC-Got-Trays.apk
