# Builds the Android app (APK) on every push to main and on manual runs.
# Download it from the run's "Artifacts" section, or from Releases when you push a tag like v1.0.0.
name: Build Android APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Install Capacitor
        run: npm install --no-audit --no-fund --legacy-peer-deps
      - name: Create Android project
        run: |
          npx cap add android
          bash android-extras/patch-android.sh
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../ShopOps-Pack.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ShopOps-Pack-apk
          path: ShopOps-Pack.apk
      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ShopOps-Pack.apk
